<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AION Local Artifact Viewer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 960px; }
    textarea { width: 100%; height: 18rem; font-family: ui-monospace, monospace; }
    pre { background: #f5f5f5; padding: 1rem; overflow: auto; }
    .note { border-left: 4px solid #444; padding-left: 1rem; }
  </style>
</head>
<body>
  <h1>AION Local Artifact Viewer</h1>
  <p class="note">Read-only helper. It performs no verification and makes no network requests. The CLI verifier remains canonical.</p>
  <p>Paste a public JSON artifact such as <code>aion.statement.json</code> or a receipt.</p>
  <textarea id="input" placeholder='{"schema_version":"..."}'></textarea>
  <p><button id="render">Render fields</button></p>
  <pre id="output">No artifact loaded.</pre>
  <script src="app.js"></script>
</body>
</html>
