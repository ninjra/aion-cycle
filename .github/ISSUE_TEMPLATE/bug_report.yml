name: Failing invariant
about: Report a case where AION prints PASS when it should fail, or FAIL when the documented route should close.
title: "Invariant report: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing the map. Please do not include secrets, private data, credentials, private source, or non-public legal material.
  - type: textarea
    id: changed_file
    attributes:
      label: File changed
      description: Name the file or fixture you changed, if any.
      placeholder: proofs/v1/public.json
    validations:
      required: false
  - type: input
    id: old_hash
    attributes:
      label: Old SHA-256
      placeholder: 64 lowercase hex characters
    validations:
      required: false
  - type: input
    id: new_hash
    attributes:
      label: New SHA-256
      placeholder: 64 lowercase hex characters
    validations:
      required: false
  - type: textarea
    id: command
    attributes:
      label: Command run
      placeholder: make verify
    validations:
      required: true
  - type: textarea
    id: stdout
    attributes:
      label: stdout
      placeholder: PASS or FAIL
    validations:
      required: true
  - type: textarea
    id: stderr
    attributes:
      label: stderr
      placeholder: FAIL_REASON:<reason_code>, if any
    validations:
      required: false
  - type: input
    id: exit_code
    attributes:
      label: Exit code
      placeholder: "0 or 1"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      placeholder: PASS or FAIL, and why.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      placeholder: What printed? Any exit code?
    validations:
      required: true
  - type: textarea
    id: clamp
    attributes:
      label: Violated clamp
      placeholder: Which positive/negative clamp did this violate?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python, node, circom, snarkjs versions.
    validations:
      required: false
